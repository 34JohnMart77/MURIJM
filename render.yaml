# One-click hosting for Muri on Render (free tier).
# After deploy you get a public https link for PC + mobile browsers.
services:
  - type: web
    name: muri
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # SQLite file inside the container (simplest; data resets on redeploy).
      # No external database or credit card needed.
      - key: DATABASE_URL
        value: sqlite:///./muri.db
      - key: GEMINI_API_KEY
        sync: false # <-- the only value you need to paste in
      - key: MURI_SECRET_KEY
        generateValue: true # Render creates this automatically
